name: arcon_core
description: "ARCON Club ve ARCONNECT ortak çekirdeği: API, oturum, modül menüsü, WebView."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  agora_rtc_engine: ^6.6.4
  audioplayers: ^6.8.1
  emoji_picker_flutter: ^4.5.4
  file_picker: ^13.1.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_callkit_incoming: ^3.1.6
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  http: ^1.6.0
  image_picker: ^1.2.4
  open_filex: ^5.0.0
  path_provider: ^2.1.6
  record: ^7.1.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  wakelock_plus: ^1.4.0
  webview_flutter: ^4.14.1
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  assets:
    - assets/arcon_logo.png
    - assets/arcon_logo_dark.png
    - assets/ringback.wav
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
